name: Sincronizar estoque EasyCar

on:
  # Roda de hora em hora na nuvem, sem depender de nenhuma maquina ligada.
  # Antes a sincronizacao de verdade vivia numa tarefa agendada da VM, que so
  # rodava quando a VM estava ligada (8 execucoes em 24h, em horarios soltos).
  #
  # Justo Car e Now Car ficam atras da Cloudflare (403 para IP de datacenter),
  # mas desde a migration 025 sao lidas pela API GraphQL da BNDV (Azure, sem
  # Cloudflare), entao todas as lojas atualizam aqui. A leitura do site fica
  # como plano B se a API falhar.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  sync:
    name: Importar estoque da EasyCar
    runs-on: ubuntu-latest
    # Now Car/Justo Car lidos por leitores públicos podem levar vários minutos.
    timeout-minutes: 18
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # 24 é o exigido em package.json engines. O sync importa
          # src/lib/pricing.ts direto, e o Node precisa saber remover os tipos.
          node-version: "24"

      - name: Instalar o driver do banco
        run: npm install pg@8.22.0 --no-save --no-audit --no-fund

      # Falha aqui com mensagem em português e explica o que corrigir, em vez
      # de deixar o `pg` estourar com "getaddrinfo EAI_AGAIN".
      - name: Conferir a DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-database-url.mjs

      - name: Aplicar migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs

      - name: Sincronizar o estoque dos parceiros
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Motor multi-parceiro: lê a lista de parceiros-fonte do banco, importa
        # o estoque de cada um que estiver ativo e retira do site o estoque dos
        # que foram desativados. A EasyCar é um desses parceiros.
        run: node scripts/sync-partners.mjs
