name: Sincronizar estoque EasyCar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-estoque
  cancel-in-progress: false

jobs:
  sync:
    name: Importar estoque da EasyCar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # 24 é o exigido em package.json engines. O sync importa
          # src/lib/pricing.ts direto, e o Node precisa saber remover os tipos.
          node-version: "24"

      - name: Instalar o driver do banco
        run: npm install pg@8.22.0 --no-save --no-audit --no-fund

      - name: Aplicar migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs

      - name: Sincronizar o estoque
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-easycar.mjs
